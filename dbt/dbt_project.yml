name: enrollment_funnel
version: "1.0.0"
config-version: 2
profile: enrollment_funnel

model-paths: ["models"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

vars:
  # Root of the raw data lake. Override for local testing, e.g.
  #   dbt build --vars '{raw_root: ../data/lake}'
  raw_root: "r2://enrollment-funnel-raw"

models:
  enrollment_funnel:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

snapshots:
  enrollment_funnel:
    +schema: snapshots

seeds:
  enrollment_funnel:
    +schema: reference
