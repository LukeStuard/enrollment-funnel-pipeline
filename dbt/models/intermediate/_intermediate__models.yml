version: 2

models:
  - name: int_leads
    description: Leads from both source systems.
    columns:
      - name: lead_id
        data_tests: [unique, not_null]
      - name: program_interest
        description: Blank when the inquiry didn't name a program (a known data quality issue).
        data_tests:
          - not_null:
              config:
                severity: warn

  - name: int_contacts
    description: Contacts from both source systems.
    columns:
      - name: contact_id
        data_tests: [unique, not_null]

  - name: int_applications
    description: Applications from both source systems.
    columns:
      - name: application_id
        data_tests: [unique, not_null]
      - name: contact_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_contacts')
                field: contact_id

  - name: int_stage_events
    description: Stage changes from both source systems.
    columns:
      - name: stage_event_id
        data_tests: [unique, not_null]
      - name: application_id
        data_tests:
          - relationships:
              arguments:
                to: ref('int_applications')
                field: application_id
      - name: lead_id
        data_tests:
          - relationships:
              arguments:
                to: ref('int_leads')
                field: lead_id

  - name: int_applicant_entry
    description: One row per applicant with their entry path (lead-first or direct).
    columns:
      - name: contact_id
        data_tests: [unique, not_null]
      - name: entry_path
        data_tests:
          - accepted_values:
              arguments:
                values: ['lead-first', 'direct']

  - name: int_application_milestones
    description: First timestamp each Application reached each stage.
    columns:
      - name: application_id
        data_tests: [unique, not_null]
