# Connection profiles. Safe to commit: every credential comes from an
# environment variable (locally set by scripts/Use-FunnelEnv.ps1, in CI by
# GitHub secrets). Run dbt from this folder so it finds this file.
enrollment_funnel:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Local warehouse file, gitignored (*.duckdb).
      path: enrollment_funnel_dev.duckdb
      threads: 4
      extensions:
        - httpfs
        - parquet
      secrets:
        - type: r2
          key_id: "{{ env_var('R2_ACCESS_KEY_ID') }}"
          secret: "{{ env_var('R2_SECRET_ACCESS_KEY') }}"
          account_id: "{{ env_var('R2_ACCOUNT_ID') }}"
          region: auto
    prod:
      type: duckdb
      # MotherDuck database owned by the funnel_pipeline service account.
      # The token comes from the MOTHERDUCK_TOKEN environment variable, never
      # from this file. R2 reads run in MotherDuck's cloud engine, which uses
      # the temporary R2 secret below.
      path: "md:enrollment_funnel"
      threads: 4
      extensions:
        - httpfs
        - parquet
      secrets:
        - type: r2
          key_id: "{{ env_var('R2_ACCESS_KEY_ID') }}"
          secret: "{{ env_var('R2_SECRET_ACCESS_KEY') }}"
          account_id: "{{ env_var('R2_ACCOUNT_ID') }}"
          region: auto
    ci:
      type: duckdb
      # Checks workflow only: a throwaway local file built from the fake lake
      # (ci/build_test_lake.py). No credentials; gitignored (*.duckdb).
      path: enrollment_funnel_ci.duckdb
      threads: 4
